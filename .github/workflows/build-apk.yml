name: Build GT TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/sdktools.zip
            unzip -q /tmp/sdktools.zip -d /tmp/gt-sdk
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv /tmp/gt-sdk/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GT-TV-Player-v3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GT-TV-Player-v3-APK
          path: GT-TV-Player-v2.apk
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view gt-tv-v3 >/dev/null 2>&1; then
            gh release upload gt-tv-v2 GT-TV-Player-v2.apk --clobber
          else
            gh release create gt-tv-v2 GT-TV-Player-v2.apk --title "GT TV Player v3.0 — Satellite Edition" --notes "16 channels, new launcher icon, auto quality, native HLS/DASH ClearKey support and enhanced remote."
          fi
